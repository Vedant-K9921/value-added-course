<!-- - Create 2 buttons 'heads' and 'tails', and a paragraph (<p></p>) underneath
When clicking the 'heads' button, display 'You chose: heads' in the paragraph.
When the 'tails' button, display 'You chose: tails'. -->

<!DOCTYPE html>
<html>
  <head></head>
  <body>
    <button onclick="
      document.querySelector('.js-choice')
        .innerHTML = 'You chose: heads';
    ">heads</button>

    <button onclick="
      document.querySelector('.js-choice')
        .innerHTML = 'You chose: tails';
    ">tails</button>

    <p class="js-choice"></p>
  </body>
</html>
