<!-- . Let's create the project on the right:
Whenever we type in the text box, update the text on the page.
To do this, we'll learn another event called <input onkeyup="...">.
This runs code after we press a keya ase It (key comes up). -->

<!DOCTYPE html>
<html>
  <head></head>
  <body>
    <input placeholder="Type something" class="js-input"
      onkeyup="
        const inputElement = document.querySelector('.js-input');
        document.querySelector('.js-message')
          .innerHTML = inputElement.value;
      ">

    <p class="js-message"></p>
  </body>
</html>
