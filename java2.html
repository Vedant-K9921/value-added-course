<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="document.getElementById('paragraph').innerHTML='Total item :'+cartquantity">Show</button>

    <script>
        let cartquantity=0;
    </script>
