<!-- copy 6a change the hour to display different messages-->

<!DOCTYPE html>
<html>
  <head></head>
  <body>
    <script>
      const hour = 10;

      if (hour >= 6 && hour <= 12) {
        console.log('Good Morning!');
      } else if (hour >= 13 && hour <= 17) {
        console.log('Good Afternoon!');
      } else if (hour >= 18 && hour <= 20) {
        console.log('Good Evening!'); 
      } else {
        console.log('Good Night!');
      }
    </script>
  </body>
</html>
