<!-- Continuing from exercise 6d, let's say the discount is only available if it is not a holiday. 
Create a variable: const isHoliday = true;
Update the code so that in order to get a discount,
people must meet the age requirement and it is also not a holiday.
Note: && has a higher priority than || so you may need to use brackets () to control which code gets done first.
Try changing the value of isHoliday to display different messages. -->

<!DOCTYPE html>
<html>
  <head></head>
  <body>
    <script>
      const age = 64;
      const isHoliday = true;

      if ((age >= 65 || age <= 6) && !isHoliday) {
        console.log('Discount');
      } else {
        console.log('No Discount');
      }
    </script>
  </body>
</html>
