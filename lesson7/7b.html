<!-- Continuing from 7a, add a parameter called 'name' to the 'greet'
function and display the message: 'Hello ${name}!'
Call the function a few times with different names: greet('Simon'); -->

<!DOCTYPE html>
<html>
  <head></head>
  <body>
    <script>
      function greet(name) {
        console.log(`Hello ${name}!`);
      }
      greet('Shweta');
      greet('Sayli');
      greet('Arya');
      greet('Shreya');
    </script>
  </body>
</html>
