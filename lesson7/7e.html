<!--Create a function 'convertToCelsius(fahrenheit)'
that takes a number in degrees Fahrenheit and returns a number in degrees Celsius.
Formula: Celsius = (Fahrenheit - 32) * 5/9
convertToCelsius(86) => 30-->

<!DOCTYPE html>
<html>
  <head></head>
  <body>
    <script>
      function convertToFahrenheit(fahrenheit) {
        return (fahrenheit - 32 ) * 5/9;
      }
      console.log(convertToFahrenheit(25));
    </script>
  </body>
</html>
